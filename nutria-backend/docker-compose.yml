services:
  db:
    image: postgres:16-alpine
    container_name: nutria-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nutria}
      POSTGRES_USER: ${DB_USER:-nutria}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nutria} -d ${DB_NAME:-nutria}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
